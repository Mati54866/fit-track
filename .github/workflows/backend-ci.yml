name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/fittrack-ci
      CLIENT_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: test-access-secret-must-be-at-least-32-characters
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: test-refresh-secret-must-be-at-least-32-characters
      JWT_REFRESH_TTL: 30d
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      CLIENT_ID: test-google-client-id
      CLIENT_SECRET: test-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/v1/auth/google/callback
      CLOUD_NAME: test-cloud
      CLOUD_API_KEY: test-key
      CLOUD_API_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
